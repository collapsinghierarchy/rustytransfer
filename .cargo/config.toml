# aes 0.8.4 and polyval 0.6.2 runtime-detect these AArch64 instructions and
# retain software fallbacks; enable the optional intrinsic implementations
# only on Linux/macOS AArch64, never via a global CPU target feature.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos")))']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
