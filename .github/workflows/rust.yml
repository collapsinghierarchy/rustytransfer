name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install SARIF tools
      run: cargo install --locked clippy-sarif@0.8.0 sarif-fmt@0.8.0
    - name: Run Clippy
      shell: bash
      run: |
        set +e
        mkdir -p target
        cargo clippy --all-targets --all-features --locked --message-format=json > target/clippy.json
        clippy_status=$?
        set -e
        clippy-sarif < target/clippy.json > target/clippy.sarif
        sarif-fmt < target/clippy.sarif
        exit "$clippy_status"
    - name: Upload Clippy SARIF report
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: target/clippy.sarif
        category: clippy

  osv-scan:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --recursive
        ./
      results-file-name: osv-results.sarif
      fail-on-vuln: false
    permissions:
      actions: read
      contents: read
      security-events: write
