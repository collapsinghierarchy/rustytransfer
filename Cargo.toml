[package]
name = "rustytransfer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
spake2 = "0.4.0"
url = "2.5.7"
uuid = "1.19.0"
wasm-bindgen = "0.2.106"

# WASM-specific random support
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
js-sys = "0.3.83"
ml-kem = "0.2.1"
rand_core = "0.6.4"
aes-gcm = { version = "0.10.3", features = ["aes"] }
rand = "0.8.5"
hmac = "0.12.1"
sha3 = "0.10.8"

# --- NATIVE ONLY DEPENDENCIES ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
just-webrtc = "0.2.0"
reqwest = { version = "0.12", features = ["json", "blocking"]}
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots", "url"] }
webrtc = "0.14.0"


#wasm-pack build --target web --out-dir ../astro/src/wasm/rustytransfer --out-name rustytransfer
