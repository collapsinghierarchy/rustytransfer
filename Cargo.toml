[package]
name = "rustytransfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = [".", "crates/crypto", "crates/protocol", "crates/transfer", "crates/native", "crates/wasm", "crates/firefox-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.103"
thiserror = "2"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
spake2 = "0.4.0"
uuid = "1.19.0"
wasm-bindgen = "0.2.106"
getrandom = "0.3"
getrandom02 = { package = "getrandom", version = "0.2" }
ml-kem = "0.2.1"
rand_core = "0.6.4"
aes-gcm = { version = "0.10.3", features = ["aes"] }
rand = "0.8.6"
hmac = "0.12.1"
sha3 = "0.10.8"
bytes = "1.11.0"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.3"
ratatui = { version = "0.29.0", features = ["unstable-widget-ref"] }
crossterm = "=0.28.1"
ratatui-explorer = "0.2.1"
async-trait = "0.1"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots", "url"] }
webrtc = "0.21.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustytransfer-crypto = { version = "0.1.0", path = "crates/crypto" }
rustytransfer-protocol = { version = "0.1.0", path = "crates/protocol" }
rustytransfer-transfer = { version = "0.1.0", path = "crates/transfer" }
rustytransfer-native = { version = "0.1.0", path = "crates/native" }
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ratatui-explorer.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustytransfer-crypto = { version = "0.1.0", path = "crates/crypto" }
rustytransfer-protocol = { version = "0.1.0", path = "crates/protocol" }

[dev-dependencies]
async-trait.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
ml-kem.workspace = true
uuid = { workspace = true, features = ["v4"] }
webrtc.workspace = true

[[bin]]
name = "rustytransfer"
path = "src/bin/rustytransferCLI.rs"

[lints]
workspace = true

[workspace.lints.clippy]
# `clippy::all` is the maintainable baseline. Restriction lints are intentionally
# enabled one by one: Clippy does not recommend applying its restriction group
# wholesale, especially to tests and invariant-preserving protocol code.
all = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
large_enum_variant = "warn"
let_underscore_future = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
no_mangle_with_rust_abi = "warn"
not_unsafe_ptr_arg_deref = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
